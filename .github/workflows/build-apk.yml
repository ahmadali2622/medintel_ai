name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: |
          cd web-portal
          npm install
          chmod +x node_modules/.bin/*

      - name: Sync Capacitor
        run: |
          cd web-portal
          mkdir -p android/app/src/main/assets
          npx cap sync

      - name: Grant execute permission for gradlew
        run: chmod +x web-portal/android/gradlew

      - name: Build APK
        run: |
          cd web-portal/android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medintel-ai-apk
          path: web-portal/android/app/build/outputs/apk/debug/app-debug.apk